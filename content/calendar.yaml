- id: 2026-12-03-carousel-rent-vs-buy-maths
  date: 2026-12-03
  time: "19:30"
  type: carousel
  pillar: rent-dont-buy
  slides:
    - kind: hook
      kicker: "Rent vs buy"
      title: "Do the **maths** before you buy"
      sub: "A 30-second check that can save you thousands."
    - kind: step
      title: "Buying really costs"
      text: |
        **Price − what you'd sell it for later + upkeep**

        A camera you sell in 2 years for half its price still cost you the other half, plus batteries, servicing and storage.
    - kind: step
      title: "Renting costs"
      text: |
        **Days you'll use it × price per day**

        The deposit comes back, so it isn't a cost.
