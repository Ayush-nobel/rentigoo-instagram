- id: 2026-12-01-carousel-deposit-rules
  date: 2026-12-01
  time: "20:00"
  type: carousel
  pillar: trust
  slides:
    - kind: hook
      kicker: "Deposits, explained"
      title: "Will I get my **deposit** back?"
      sub: "How deposits work on RentiGoo."
    - kind: step
      title: "There's a limit"
      text: |
        An owner can ask for at most **30%** of what the item cost new, and never more than the limit for that kind of item.

        Items that cost more than ₹5,000 need the original bill, which only RentiGoo sees.
    - kind: step
      title: "Photos at pickup and return"
      text: "Owner and renter both photograph the item when it's handed over and when it comes back. Those dated photos are the condition record."
    - kind: dark
      kicker: "The rule"
      title: "Back within **24 hours**"
      text: "If it comes back as it left, the owner returns the full deposit within 24 hours of the return."
    - kind: step
      title: "If something is damaged"
      text: "The owner must report it to RentiGoo within 24 hours, with photos, and can keep only the reasonable repair cost. RentiGoo decides any dispute from the photos."
    - kind: cta
      title: "Save this for your next rental"
      lines: ["Save it", "Share with a friend who worries about deposits", "Questions? WhatsApp +91 93014 22919", "Full rules: rentigoo.in/refunds"]
  caption: |
    "Deposit wapas milega ya nahi?" 🤔 Sabse common sawaal. Jawaab yeh raha 👇

    ✅ Deposit ki limit hai: item ki nayi keemat ka max 30%
    ✅ Pickup aur return pe dono taraf se photos
    ✅ Sab theek hai toh deposit 24 ghante mein wapas
    ✅ Damage ho toh 24 ghante mein photos ke saath report, aur sirf repair ka reasonable kharcha

    Sawaal? WhatsApp karo +91 93014 22919 💬
