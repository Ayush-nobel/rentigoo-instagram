name: Publish due posts

# Posts are scheduled 7-9 pm IST. GitHub cron is in UTC and can start a few
# minutes late, so this runs every 30 minutes from 7:00 to 9:30 pm IST
# (13:30-16:00 UTC). Each run publishes only what's due and not yet published.
on:
  schedule:
    - cron: "30 13 * * *"   # 7:00 pm IST
    - cron: "0,30 14,15 * * *" # 7:30, 8:00, 8:30, 9:00 pm IST
    - cron: "0 16 * * *"    # 9:30 pm IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (publish nothing, just show what would go out)"
        type: boolean
        default: true
      only:
        description: "Only this post id (optional)"
        type: string
        default: ""

permissions:
  contents: write # to save state/published.json and the log back to the repo

# Never two publishers at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v25.0' }}
          HASHTAG_LIMIT: ${{ vars.HASHTAG_LIMIT || '5' }}
          # Scheduled runs are live only once you set the repository variable PUBLISHING_ENABLED=true.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event_name == 'schedule' && vars.PUBLISHING_ENABLED != 'true') }}
        run: node scripts/publish.mjs ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Save what was published
        if: always()
        run: |
          git config user.name "rentigoo-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/published.json logs/publish.log
          git diff --cached --quiet || (git commit -m "Publish log $(date -u +%FT%TZ)" && git pull --rebase && git push)
