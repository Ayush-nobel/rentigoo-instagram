name: Weekly growth report

# Every Monday at 9:00 am IST (3:30 UTC), for the week that just ended.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write the report
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v25.0' }}
        run: node scripts/report.mjs
      - name: Save it
        run: |
          git config user.name "rentigoo-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || (git commit -m "Weekly report" && git pull --rebase && git push)
